name: Practice feedback
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run the 60-point automated rubric
        run: python grading/grade.py
      - name: Save automated score and detailed feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-feedback-60-points
          path: |
            grade-results.json
            grade-summary.md
          if-no-files-found: warn
